<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cards</title>
<link rel="stylesheet" href="css/common.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:#edf3f6;font-family:"Noto Sans CJK KR","Noto Sans KR","Malgun Gothic",sans-serif}
body{display:grid;place-items:center;padding:5vh 6vw}
.panel{width:min(82vw,1380px);height:min(82vh,830px);padding:40px;background:linear-gradient(180deg,rgba(15,42,56,.72),rgba(9,27,38,.66));border:1px solid rgba(175,225,250,.36);box-shadow:0 24px 80px rgba(0,0,0,.42);backdrop-filter:blur(12px);overflow:auto}
.code{font-size:10px;letter-spacing:.20em;color:#afc0c8;margin:0 0 10px}
h1{font-size:clamp(22px,2.7vw,38px);margin:0 0 8px}.sub{font-size:13px;color:#c3cdd2;margin-bottom:26px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.tab{padding:8px 12px;border:1px solid rgba(220,235,240,.18);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.item{min-height:150px;padding:18px;border:1px solid rgba(220,235,240,.14);background:rgba(255,255,255,.035)}.item strong{display:block;margin-bottom:10px}.item span{font-size:12px;line-height:1.7;color:#b8c5ca}
@media(max-width:900px){.panel{width:94vw;height:auto;min-height:90vh}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body id="body">
<main class="panel" id="panel">
<p class="code">EQUIPMENT STORAGE / INVENTORY DATABASE</p><h1>CARD DATABASE</h1><p class="sub">장비 창고: 카드 열람</p>
<div class="tabs"><div class="tab">전체</div><div class="tab">기록 카드</div><div class="tab">현장 장비</div><div class="tab">지원 카드</div><div class="tab">복합 카드</div></div>
<section class="grid"><article class="item"><strong>기록 카드</strong><span>사진·문서·생물 기록 등.</span></article><article class="item"><strong>현장 장비</strong><span>공구·보호 장비·소모품.</span></article><article class="item"><strong>지원 카드</strong><span>기술 지원 및 제한 자산.</span></article><article class="item"><strong>복합 카드</strong><span>도면·매뉴얼·특수 부품.</span></article></section>
</main>
<script>
const b=document.getElementById("body"),p=document.getElementById("panel");
b.addEventListener("click",e=>{if(!p.contains(e.target)) parent.postMessage("ARGO_CLOSE_PANEL","*");});
p.addEventListener("click",e=>e.stopPropagation());
</script>
</body></html>
