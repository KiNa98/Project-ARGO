<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project ARGO NOTE — MAIN</title>
  <style>
    :root{
      --text:#f3f7f8;
      --ui-bg:rgba(8,14,18,.78);
      --ui-border:rgba(190,225,235,.38);
      --label-bg:rgba(7,13,17,.88);
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);
      font-family:"Noto Sans CJK KR","Noto Sans KR","Malgun Gothic",sans-serif
    }

    .entry-curtain{
      position:fixed;inset:0;z-index:3000;background:#000;opacity:1;pointer-events:none;
      transition:opacity .34s ease
    }
    .entry-curtain.hide{opacity:0}

    .main-stage{
      position:relative;width:100vw;height:100vh;overflow:hidden;background:#000;user-select:none
    }
    .scene{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);aspect-ratio:1672/941
    }
    @media (min-aspect-ratio:1672/941){.scene{width:100vw;height:auto}}
    @media (max-aspect-ratio:1672/941){.scene{width:auto;height:100vh}}

    .main-bg{
      position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:fill;
      pointer-events:none;user-select:none;-webkit-user-drag:none
    }

    .hotspot{
      --spot-rgb:90,200,220;
      position:absolute;z-index:10;display:block;
      background:rgba(var(--spot-rgb),.08);
      border:2px solid rgba(var(--spot-rgb),.20);
      border-radius:5px;text-decoration:none;cursor:pointer;
      animation:hotspotPulse 4.8s ease-in-out infinite;
      transition:background-color .16s ease,border-color .16s ease,box-shadow .16s ease
    }
    @keyframes hotspotPulse{
      0%,68%,100%{
        background:rgba(var(--spot-rgb),.06);
        border-color:rgba(var(--spot-rgb),.16);
        box-shadow:0 0 0 rgba(var(--spot-rgb),0)
      }
      82%{
        background:rgba(var(--spot-rgb),.20);
        border-color:rgba(var(--spot-rgb),.50);
        box-shadow:inset 0 0 34px rgba(var(--spot-rgb),.08),0 0 18px rgba(var(--spot-rgb),.18)
      }
    }
    .hotspot::after{
      content:attr(data-label);position:absolute;left:50%;bottom:10px;transform:translate(-50%,6px);
      max-width:calc(100% - 16px);padding:7px 10px;
      border:1px solid rgba(var(--spot-rgb),.48);border-radius:4px;
      background:var(--label-bg);color:var(--text);
      font-size:clamp(10px,.88vw,14px);font-weight:700;line-height:1.35;letter-spacing:.025em;
      text-align:center;white-space:nowrap;opacity:0;pointer-events:none;
      transition:opacity .16s ease,transform .16s ease
    }
    .hotspot:hover,.hotspot:focus-visible,.main-stage.show-hotspots .hotspot{
      animation-play-state:paused;background:rgba(var(--spot-rgb),.24);
      border-color:rgba(var(--spot-rgb),.82);
      box-shadow:inset 0 0 36px rgba(var(--spot-rgb),.12),0 0 20px rgba(var(--spot-rgb),.22);
      outline:none
    }
    .hotspot:hover::after,.hotspot:focus-visible::after,.main-stage.show-hotspots .hotspot::after{
      opacity:1;transform:translate(-50%,0)
    }

    .hotspot-lounge{--spot-rgb:90,190,255;left:1.5%;top:2%;width:28.2%;height:36%;animation-delay:0s}
    .hotspot-storage{--spot-rgb:205,158,42;left:29.6%;top:2%;width:17.5%;height:36%;animation-delay:-1.2s}
    .hotspot-office{--spot-rgb:92,232,190;left:.8%;top:38%;width:46.2%;height:33.5%;animation-delay:-2.4s}
    .hotspot-elevator{--spot-rgb:245,118,128;left:72%;top:26.5%;width:27.2%;height:56.5%;animation-delay:-3.6s}

    .interaction-guide{
      position:fixed;z-index:100;top:16px;right:16px;display:inline-flex;align-items:center;gap:8px;
      min-height:38px;padding:8px 12px;border:1px solid var(--ui-border);border-radius:4px;
      background:var(--ui-bg);color:var(--text);font:inherit;font-size:12px;font-weight:700;
      letter-spacing:.08em;cursor:pointer;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)
    }
    .interaction-guide:hover,.interaction-guide:focus-visible,.interaction-guide.active{
      background:rgba(20,50,60,.92);border-color:rgba(155,235,255,.72);outline:none
    }
    .interaction-dot{
      width:9px;height:9px;border-radius:50%;border:1px solid rgba(170,235,250,.92);
      background:rgba(80,190,220,.22)
    }
    .interaction-guide.active .interaction-dot{
      background:rgba(120,225,250,.92);box-shadow:0 0 8px rgba(120,225,250,.68)
    }

    .main-hint,.toast{
      position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);z-index:110;
      max-width:min(90vw,470px);padding:10px 14px;border:1px solid rgba(190,225,235,.34);
      border-radius:4px;background:rgba(7,13,17,.84);color:rgba(245,249,250,.94);
      font-size:12px;text-align:center;opacity:0;pointer-events:none;
      backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
      transition:opacity .22s ease,transform .22s ease
    }
    .main-hint.show,.toast.show{opacity:1;transform:translate(-50%,0)}

    /* =========================================================
       PANEL OVERLAY
       핵심 수정:
       - 외곽 panel-shell을 '창'으로 보이게 하지 않음
       - iframe은 사실상 전체 화면 투명 레이어
       - 실제 패널 모양은 각 내부 페이지가 담당
       ========================================================= */
    .panel-overlay{
      position:fixed;inset:0;z-index:2000;
      visibility:hidden;opacity:0;pointer-events:none;
      background:#000;
      transition:opacity .22s ease,visibility .22s ease
    }
    .panel-overlay.active{
      visibility:visible;opacity:1;pointer-events:auto
    }

    .panel-random-bg{
      position:absolute;inset:0;z-index:0;
      background-position:center;background-size:cover;background-repeat:no-repeat;
      opacity:.50;transform:scale(1.012);
      transition:opacity .24s ease,transform .5s ease
    }
    .panel-overlay.active .panel-random-bg{transform:scale(1)}

    .panel-dimmer{
      position:absolute;inset:0;z-index:1;
      background:
        radial-gradient(circle at center,
          rgba(0,0,0,.32) 0%,
          rgba(0,0,0,.48) 58%,
          rgba(0,0,0,.62) 100%);
      pointer-events:none
    }

    /* 더 이상 보이는 검은 직사각형 패널을 만들지 않는다. */
    .panel-shell{
      position:absolute;
      inset:0;
      z-index:3;
      background:transparent;
      border:0;
      box-shadow:none;
      overflow:hidden;
    }

    .panel-frame{
      display:block;
      width:100%;
      height:100%;
      border:0;
      background:transparent;
    }

    .panel-close{
      position:fixed;
      z-index:10;
      top:4.2vh;
      right:4.4vw;
      width:46px;
      height:46px;
      border:1px solid rgba(210,235,248,.34);
      border-radius:50%;
      background:rgba(3,10,15,.48);
      color:#eef7fb;
      font-size:27px;
      font-weight:300;
      line-height:1;
      cursor:pointer;
      backdrop-filter:blur(9px);
      -webkit-backdrop-filter:blur(9px);
      box-shadow:0 0 14px rgba(110,205,255,.09);
      transition:background .15s ease,border-color .15s ease,transform .15s ease
    }
    .panel-close:hover,.panel-close:focus-visible{
      background:rgba(25,60,82,.84);
      border-color:rgba(175,230,255,.78);
      transform:scale(1.05);
      outline:none
    }

    @media(max-width:700px){
      .interaction-guide{top:10px;right:10px;padding:7px 9px;font-size:10px}
      .hotspot::after{bottom:5px;padding:5px 7px;font-size:9px;white-space:normal}
      .panel-close{top:18px;right:18px;width:42px;height:42px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none!important;transition:none!important}
    }
  </style>
</head>
<body>
  <div class="entry-curtain" id="entryCurtain" aria-hidden="true"></div>

  <main class="main-stage" id="mainStage" aria-label="Project ARGO NOTE 메인 거점">
    <div class="scene">
      <img class="main-bg" src="images/site-main.jpg"
           alt="반지하 지하철 역사를 개조한 서울 생활권 확장 사업 거점"
           draggable="false">

      <a class="hotspot hotspot-lounge"
         href="lounge.html" data-panel="lounge"
         data-label="휴게실: 뉴스 및 단편 열람"
         aria-label="휴게실: 뉴스 및 단편 열람"></a>

      <a class="hotspot hotspot-storage"
         href="cards.html" data-panel="cards"
         data-label="장비 창고: 카드 열람"
         aria-label="장비 창고: 카드 열람"></a>

      <a class="hotspot hotspot-office"
         href="archive.html" data-panel="archive"
         data-label="사무실: 출입 명부 및 기록 확인"
         aria-label="사무실: 출입 명부 및 기록 확인"></a>

      <a class="hotspot hotspot-elevator"
         href="#" data-route="gameplay"
         data-label="체험판 테스트 플레이"
         aria-label="체험판 테스트 플레이"></a>
    </div>
  </main>

  <button class="interaction-guide" id="interactionGuide" type="button"
          aria-pressed="false" aria-controls="mainStage">
    <span class="interaction-dot" aria-hidden="true"></span>
    INTERACTION
  </button>

  <div class="main-hint" id="mainHint">점멸하는 구역을 선택해 이동할 수 있습니다.</div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <section class="panel-overlay" id="panelOverlay" aria-hidden="true">
    <div class="panel-random-bg" id="panelRandomBg"></div>
    <div class="panel-dimmer"></div>

    <div class="panel-shell" id="panelShell">
      <iframe class="panel-frame" id="panelFrame"
              title="Project ARGO NOTE 콘텐츠 패널"
              src="about:blank"></iframe>
    </div>

    <button class="panel-close" id="panelClose" type="button" aria-label="패널 닫기">×</button>
  </section>

  <script>
    const PANEL_BACKGROUNDS = [
      "images/BBG_01.jpg",
      "images/BBG_02.jpg",
      "images/BBG_03.jpg",
      "images/BBG_04.jpg",
      "images/BBG_05.jpg",
      "images/BBG_06.jpg",
      "images/BBG_07.jpg"
    ];

    const PANEL_PAGES = {
      archive: "archive.html",
      lounge: "lounge.html",
      cards: "cards.html"
    };

    const stage = document.getElementById("mainStage");
    const guideButton = document.getElementById("interactionGuide");
    const mainHint = document.getElementById("mainHint");
    const toast = document.getElementById("toast");
    const entryCurtain = document.getElementById("entryCurtain");

    const panelOverlay = document.getElementById("panelOverlay");
    const panelShell = document.getElementById("panelShell");
    const panelFrame = document.getElementById("panelFrame");
    const panelClose = document.getElementById("panelClose");
    const panelRandomBg = document.getElementById("panelRandomBg");

    let toastTimer;
    let lastBackgroundIndex = -1;

    window.addEventListener("load", () => {
      setTimeout(() => entryCurtain.classList.add("hide"), 120);
      setTimeout(() => mainHint.classList.add("show"), 650);
      setTimeout(() => mainHint.classList.remove("show"), 4300);
    });

    guideButton.addEventListener("click", () => {
      const isActive = stage.classList.toggle("show-hotspots");
      guideButton.classList.toggle("active", isActive);
      guideButton.setAttribute("aria-pressed", String(isActive));
    });

    document.querySelectorAll("[data-panel]").forEach((hotspot) => {
      hotspot.addEventListener("click", (event) => {
        event.preventDefault();
        const page = PANEL_PAGES[hotspot.dataset.panel];
        if (page) openPanel(page);
      });
    });

    function openPanel(page){
      setRandomPanelBackground();
      panelFrame.src = page;
      panelOverlay.classList.add("active");
      panelOverlay.setAttribute("aria-hidden","false");
      mainHint.classList.remove("show");
      guideButton.style.visibility = "hidden";
    }

    function closePanel(){
      panelOverlay.classList.remove("active");
      panelOverlay.setAttribute("aria-hidden","true");
      guideButton.style.visibility = "";
      setTimeout(() => {
        if (!panelOverlay.classList.contains("active")) {
          panelFrame.src = "about:blank";
        }
      },240);
    }

    function setRandomPanelBackground(){
      if (!PANEL_BACKGROUNDS.length) return;
      let index;
      if (PANEL_BACKGROUNDS.length === 1) index = 0;
      else {
        do {
          index = Math.floor(Math.random() * PANEL_BACKGROUNDS.length);
        } while(index === lastBackgroundIndex);
      }
      lastBackgroundIndex = index;
      panelRandomBg.style.backgroundImage = `url("${PANEL_BACKGROUNDS[index]}")`;
    }

    panelClose.addEventListener("click", closePanel);

    /* iframe 자체가 전체 화면을 덮기 때문에,
       바깥 클릭 닫기는 내부 페이지의 투명 바깥 영역에서 parent.postMessage로 처리 */
    window.addEventListener("message", (event) => {
      if (event.data === "ARGO_CLOSE_PANEL") closePanel();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && panelOverlay.classList.contains("active")) {
        closePanel();
      }
    });

    document.querySelector('[data-route="gameplay"]').addEventListener("click", (event) => {
      event.preventDefault();
      showToast("체험판 테스트 플레이 페이지는 현재 준비 중입니다.");
    });

    function showToast(message){
      clearTimeout(toastTimer);
      mainHint.classList.remove("show");
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"),1800);
    }
  </script>
</body>
</html>
