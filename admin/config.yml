backend:
  name: github
  repo: KiNa98/Project-ARGO
  branch: main
  use_graphql: true

media_folder: "images/uploads"
public_folder: "images/uploads"

locale: "ko"

collections:
  - name: "archive"
    label: "아카이브"
    files:

      - label: "세계관"
        name: "world"
        file: "content/archive/world.json"
        fields:
          - label: "세계관 항목"
            name: "items"
            widget: "list"
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "설명", name: "text", widget: "text" }
              - { label: "사이트에 표시", name: "visible", widget: "boolean", default: true }

      - label: "설정"
        name: "settings"
        file: "content/archive/settings.json"
        fields:
          - label: "설정 목록"
            name: "items"
            widget: "list"
            collapsed: true
            summary: "{{fields.label}}"
            fields:
              - { label: "목록 표시명", name: "label", widget: "string" }
              - { label: "분류", name: "type", widget: "string", required: false }
              - { label: "제목", name: "title", widget: "string" }
              - { label: "대표 이미지", name: "image", widget: "image", required: false }
              - { label: "짧은 설명", name: "short", widget: "text" }
              - label: "상세 설명"
                name: "body"
                widget: "list"
                required: false
                field:
                  label: "문단"
                  name: "paragraph"
                  widget: "text"
              - { label: "사이트에 표시", name: "visible", widget: "boolean", default: true }

      - label: "지역"
        name: "regions"
        file: "content/archive/regions.json"
        fields:
          - label: "지역 목록"
            name: "items"
            widget: "list"
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { label: "목록 표시명", name: "label", widget: "string", required: false }
              - { label: "분류", name: "type", widget: "string", required: false }
              - { label: "지역명", name: "title", widget: "string" }
              - { label: "대표 이미지", name: "image", widget: "image", required: false }
              - { label: "짧은 설명", name: "short", widget: "text" }
              - label: "상세 설명"
                name: "body"
                widget: "list"
                required: false
                field:
                  label: "문단"
                  name: "paragraph"
                  widget: "text"
              - { label: "사이트에 표시", name: "visible", widget: "boolean", default: true }

      - label: "집단"
        name: "groups"
        file: "content/archive/groups.json"
        fields:
          - label: "집단 목록"
            name: "items"
            widget: "list"
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { label: "목록 표시명", name: "label", widget: "string", required: false }
              - { label: "분류", name: "type", widget: "string", required: false }
              - { label: "집단명", name: "title", widget: "string" }
              - { label: "상징 이미지 / 로고", name: "image", widget: "image", required: false }
              - { label: "짧은 설명", name: "short", widget: "text" }
              - label: "상세 설명"
                name: "body"
                widget: "list"
                required: false
                field:
                  label: "문단"
                  name: "paragraph"
                  widget: "text"
              - { label: "사이트에 표시", name: "visible", widget: "boolean", default: true }

      - label: "인물"
        name: "personnel"
        file: "content/archive/personnel.json"
        fields:
          - label: "인물 목록"
            name: "items"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { label: "이름", name: "name", widget: "string" }
              - { label: "대표 이미지", name: "cover", widget: "image", required: false }

              - label: "상세 이미지"
                name: "gallery"
                widget: "list"
                required: false
                field:
                  label: "이미지"
                  name: "image"
                  widget: "image"

              - { label: "연령", name: "age", widget: "string", required: false }
              - { label: "성별", name: "gender", widget: "string", required: false }
              - { label: "대표 대사", name: "quote", widget: "text", required: false }
              - { label: "분류 / 종족", name: "species", widget: "string", required: false }
              - { label: "출신", name: "origin", widget: "string", required: false }
              - { label: "직업", name: "job", widget: "string", required: false }
              - { label: "소속", name: "affiliation", widget: "string", required: false }
              - { label: "외모", name: "appearance", widget: "text", required: false }

              - label: "복장"
                name: "outfits"
                widget: "list"
                required: false
                field:
                  label: "복장"
                  name: "outfit"
                  widget: "string"

              - { label: "특기", name: "specialty", widget: "text", required: false }
              - { label: "간략 소개", name: "summary", widget: "text", required: false }
              - { label: "사이트에 표시", name: "visible", widget: "boolean", default: true }
