backend:
  name: github
  repo: KiNa98/Project-ARGO
  branch: main
  use_graphql: true

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "ko"

collections:
  - name: "archive"
    label: "아카이브"
    files:

      - label: "세계관"
        name: "world"
        file: "content/archive/world.json"
        fields:
          - label: "세계관 항목"
            name: "items"
            widget: "list"
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - label: "제목"
                name: "title"
                widget: "string"

              - label: "설명"
                name: "text"
                widget: "text"

              - label: "사이트에 표시"
                name: "visible"
                widget: "boolean"
                default: true

      - label: "설정"
        name: "settings"
        file: "content/archive/settings.json"
        fields:
          - label: "설정 목록"
            name: "items"
            widget: "list"
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - label: "목록 표시명"
                name: "label"
                widget: "string"

              - label: "분류"
                name: "type"
                widget: "string"
                required: false

              - label: "제목"
                name: "title"
                widget: "string"

              - label: "대표 이미지"
                name: "image"
                widget: "image"
                required: false

              - label: "짧은 설명"
                name: "short"
                widget: "text"

              - label: "상세 설명"
                name: "body"
                widget: "text"
                required: false
                hint: "여러 문단은 빈 줄로 구분합니다."

              - label: "사이트에 표시"
                name: "visible"
                widget: "boolean"
                default: true

      - label: "지역"
        name: "regions"
        file: "content/archive/regions.json"
        fields:
          - label: "지역 목록"
            name: "items"
            widget: "list"
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - label: "목록 표시명"
                name: "label"
                widget: "string"

              - label: "분류"
                name: "type"
                widget: "string"
                required: false

              - label: "지역명"
                name: "title"
                widget: "string"

              - label: "대표 이미지"
                name: "image"
                widget: "image"
                required: false

              - label: "짧은 설명"
                name: "short"
                widget: "text"

              - label: "상세 설명"
                name: "body"
                widget: "text"
                required: false
                hint: "여러 문단은 빈 줄로 구분합니다."

              - label: "사이트에 표시"
                name: "visible"
                widget: "boolean"
                default: true

      - label: "집단"
        name: "groups"
        file: "content/archive/groups.json"
        fields:
          - label: "집단 목록"
            name: "items"
            widget: "list"
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - label: "목록 표시명"
                name: "label"
                widget: "string"

              - label: "분류"
                name: "type"
                widget: "string"
                required: false

              - label: "집단명"
                name: "title"
                widget: "string"

              - label: "상징 이미지 / 로고"
                name: "image"
                widget: "image"
                required: false

              - label: "짧은 설명"
                name: "short"
                widget: "text"

              - label: "상세 설명"
                name: "body"
                widget: "text"
                required: false
                hint: "여러 문단은 빈 줄로 구분합니다."

              - label: "사이트에 표시"
                name: "visible"
                widget: "boolean"
                default: true

      - label: "인물"
        name: "personnel"
        file: "content/archive/personnel.json"
        fields:
          - label: "인물 목록"
            name: "items"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - label: "이름"
                name: "name"
                widget: "string"

              - label: "대표 이미지"
                name: "cover"
                widget: "image"
                required: false

              - label: "상세 이미지 1"
                name: "gallery1"
                widget: "image"
                required: false

              - label: "상세 이미지 2"
                name: "gallery2"
                widget: "image"
                required: false

              - label: "상세 이미지 3"
                name: "gallery3"
                widget: "image"
                required: false

              - label: "상세 이미지 4"
                name: "gallery4"
                widget: "image"
                required: false

              - label: "상세 이미지 5 / 시트"
                name: "gallery5"
                widget: "image"
                required: false

              - label: "연령"
                name: "age"
                widget: "string"
                required: false

              - label: "성별"
                name: "gender"
                widget: "string"
                required: false

              - label: "대표 대사"
                name: "quote"
                widget: "text"
                required: false

              - label: "분류 / 종족"
                name: "species"
                widget: "string"
                required: false

              - label: "출신"
                name: "origin"
                widget: "string"
                required: false

              - label: "직업"
                name: "job"
                widget: "string"
                required: false

              - label: "소속"
                name: "affiliation"
                widget: "string"
                required: false

              - label: "외모"
                name: "appearance"
                widget: "text"
                required: false

              - label: "복장 A"
                name: "outfit1"
                widget: "string"
                required: false

              - label: "복장 B"
                name: "outfit2"
                widget: "string"
                required: false

              - label: "복장 C"
                name: "outfit3"
                widget: "string"
                required: false

              - label: "특기"
                name: "specialty"
                widget: "text"
                required: false

              - label: "간략 소개"
                name: "summary"
                widget: "text"
                required: false

              - label: "사이트에 표시"
                name: "visible"
                widget: "boolean"
                default: true
