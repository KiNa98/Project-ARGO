<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lounge</title>
<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  color:#2d2b27;
  font-family:"Noto Sans CJK KR","Noto Sans KR","Malgun Gothic",sans-serif;
}

body{
  display:grid;
  place-items:center;
  padding:4.5vh 5.2vw;
}

/* =========================================================
   BOOK / PAPER PANEL
   ========================================================= */
.book{
  position:relative;
  width:min(84vw,1480px);
  height:min(82vh,830px);

  display:grid;
  grid-template-columns:1fr 1fr;

  background:
    linear-gradient(90deg,
      rgba(248,246,239,.97) 0%,
      rgba(248,246,239,.97) 49.6%,
      rgba(235,231,220,.98) 49.9%,
      rgba(226,221,209,.98) 50%,
      rgba(235,231,220,.98) 50.1%,
      rgba(248,246,239,.97) 50.4%,
      rgba(248,246,239,.97) 100%);

  border:1px solid rgba(195,190,178,.42);
  border-radius:4px;

  box-shadow:
    0 26px 88px rgba(0,0,0,.40),
    0 3px 12px rgba(0,0,0,.08);

  overflow:visible;
}

/* 책의 중앙 접힘 */
.book::before{
  content:"";
  position:absolute;
  z-index:2;
  left:50%;
  top:0;
  bottom:0;
  width:1px;
  transform:translateX(-50%);

  background:rgba(110,104,93,.19);

  box-shadow:
    -8px 0 18px rgba(0,0,0,.04),
     8px 0 18px rgba(0,0,0,.04);

  pointer-events:none;
}

/* 아주 얇은 종이 외곽선 */
.book::after{
  content:"";
  position:absolute;
  inset:10px;
  border:1px solid rgba(135,130,119,.07);
  pointer-events:none;
}

/* =========================================================
   BOOKMARK BUTTONS
   ========================================================= */
.bookmarks{
  position:absolute;
  z-index:8;
  top:-18px;
  left:50%;
  transform:translateX(-50%);

  display:flex;
  gap:10px;
}

.bookmark{
  min-width:120px;
  padding:9px 16px 11px;

  border:1px solid rgba(120,113,100,.18);
  border-bottom:0;
  border-radius:6px 6px 0 0;

  background:rgba(231,226,214,.97);
  color:#5a554d;

  font:inherit;
  font-size:11px;
  font-weight:700;
  letter-spacing:.12em;

  cursor:pointer;

  box-shadow:0 -4px 14px rgba(0,0,0,.05);

  transition:
    transform .15s ease,
    background .15s ease,
    color .15s ease;
}

.bookmark:hover,
.bookmark:focus-visible{
  transform:translateY(-2px);
  outline:none;
}

.bookmark.active{
  background:#faf8f2;
  color:#292722;
}

/* =========================================================
   PAGE LAYOUT
   ========================================================= */
.page{
  position:relative;
  min-width:0;
  min-height:0;

  padding:42px 38px 34px;

  overflow:auto;
}

.page-left{
  border-right:1px solid rgba(115,110,100,.06);
}

.page-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:18px;

  margin-bottom:22px;
  padding-bottom:12px;

  border-bottom:1px solid rgba(98,94,85,.13);
}

.page-kicker{
  margin:0 0 4px;
  color:rgba(65,62,57,.46);
  font-size:8px;
  letter-spacing:.20em;
}

.page-title{
  margin:0;
  color:#302e29;
  font-size:18px;
  font-weight:700;
}

.page-meta{
  color:rgba(72,69,63,.40);
  font-size:8px;
  line-height:1.5;
  letter-spacing:.10em;
  text-align:right;
}

/* =========================================================
   DEFAULT / COVER MODE
   ========================================================= */
.cover-panel{
  height:calc(100% - 64px);

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;
}

.cover-thumb{
  width:min(78%,440px);
  aspect-ratio:16/9;

  display:grid;
  place-items:center;

  margin-bottom:20px;

  overflow:hidden;
  border:1px solid rgba(100,96,88,.12);

  background:rgba(223,219,208,.42);
}

.cover-thumb img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

.cover-placeholder{
  color:rgba(83,79,72,.40);
  font-size:10px;
  letter-spacing:.10em;
}

.cover-label{
  margin:0 0 8px;
  color:rgba(65,62,57,.48);
  font-size:9px;
  font-weight:700;
  letter-spacing:.16em;
}

.cover-copy{
  max-width:360px;
  margin:0;

  color:#5b5750;
  font-size:12px;
  line-height:1.8;
}

/* =========================================================
   LIST + ARTICLE MODE
   왼쪽: 글 목록 / 오른쪽: 선택 글
   ========================================================= */
.article-list{
  display:flex;
  flex-direction:column;
  gap:0;
}

.article-button{
  width:100%;
  padding:14px 3px;

  border:0;
  border-bottom:1px solid rgba(102,98,90,.12);

  background:transparent;
  color:#302e2a;

  font:inherit;
  text-align:left;
  cursor:pointer;
}

.article-button:hover,
.article-button:focus-visible{
  background:rgba(110,102,90,.045);
  outline:none;
}

.article-button.active{
  background:rgba(110,102,90,.065);
}

.article-category{
  display:block;
  margin-bottom:5px;

  color:rgba(74,71,65,.42);
  font-size:8px;
  letter-spacing:.14em;
}

.article-title{
  display:block;
  font-size:15px;
  font-weight:700;
  line-height:1.45;
}

.article-date{
  display:block;
  margin-top:5px;

  color:rgba(74,71,65,.42);
  font-size:9px;
}

.article-view{
  padding:4px 4px 40px;
}

.article-view h2{
  margin:0 0 8px;
  color:#2d2b27;
  font-size:24px;
  line-height:1.45;
}

.article-view .meta{
  margin:0 0 24px;
  color:rgba(71,68,62,.48);
  font-size:9px;
  letter-spacing:.08em;
}

.article-image{
  width:100%;
  aspect-ratio:16/9;
  margin-bottom:22px;

  overflow:hidden;
  border:1px solid rgba(100,96,88,.12);
  background:rgba(223,219,208,.42);
}

.article-image img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

.article-view p{
  margin:0 0 14px;
  color:#48453f;
  font-size:13px;
  line-height:1.95;
}

/* =========================================================
   MOBILE
   ========================================================= */
@media(max-width:850px){
  body{
    padding:4vh 3vw;
    overflow:auto;
  }

  .book{
    width:94vw;
    height:auto;
    min-height:90vh;

    grid-template-columns:1fr;

    background:rgba(248,246,239,.97);
  }

  .book::before{
    display:none;
  }

  .bookmarks{
    position:sticky;
    top:0;
    transform:none;
    left:auto;
    justify-content:center;
    margin-top:-18px;
    grid-column:1;
  }

  .page{
    min-height:46vh;
    padding:34px 24px;
  }

  .page-left{
    border-right:0;
    border-bottom:1px solid rgba(115,110,100,.10);
  }
}
</style>
</head>

<body id="loungeBody">

<main class="book" id="loungeBook">

  <nav class="bookmarks" aria-label="휴게실 읽을거리">
    <button class="bookmark" id="newsTab" type="button">NEWS</button>
    <button class="bookmark" id="storyTab" type="button">SHORT STORY</button>
  </nav>

  <section class="page page-left" id="leftPage"></section>
  <section class="page page-right" id="rightPage"></section>

</main>

<script>

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function paragraphs(text){
  const raw = String(text ?? "").trim();
  if(!raw) return "";
  return raw
    .split(/\n\s*\n/)
    .map(p => `<p>${escapeHtml(p).replaceAll("\n","<br>")}</p>`)
    .join("");
}

async function loadJson(path){
  const response = await fetch(path, {cache:"no-store"});
  if(!response.ok) throw new Error(`${path}: ${response.status}`);
  return response.json();
}


const loungeBody = document.getElementById("loungeBody");
const loungeBook = document.getElementById("loungeBook");
const leftPage = document.getElementById("leftPage");
const rightPage = document.getElementById("rightPage");
const newsTab = document.getElementById("newsTab");
const storyTab = document.getElementById("storyTab");

let NEWS_ARTICLES = [];
let STORY_ARTICLES = [];

function visibleItems(items){
  return (Array.isArray(items) ? items : []).filter(item => item.visible !== false);
}

function randomWithImage(items){
  const withImage = visibleItems(items).filter(x=>x.image);
  if(!withImage.length) return null;
  return withImage[Math.floor(Math.random()*withImage.length)];
}

function coverImage(item, alt){
  if(!item?.image){
    return `
      <div class="cover-thumb">
        <span class="cover-placeholder">IMAGE PREVIEW</span>
      </div>
    `;
  }

  return `
    <div class="cover-thumb">
      <img src="${escapeHtml(item.image)}" alt="${escapeHtml(alt)}"
           onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
      <span class="cover-placeholder" style="display:none;">IMAGE PREVIEW</span>
    </div>
  `;
}

function articleImage(item){
  if(!item?.image) return "";
  return `
    <div class="article-image">
      <img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title)}"
           onerror="this.parentElement.style.display='none';">
    </div>
  `;
}

function renderCover(){
  newsTab.classList.remove("active");
  storyTab.classList.remove("active");

  const newsItem = randomWithImage(NEWS_ARTICLES);
  const storyItem = randomWithImage(STORY_ARTICLES);

  leftPage.innerHTML = `
    <header class="page-header">
      <div>
        <p class="page-kicker">LOUNGE READING MATERIAL</p>
        <h1 class="page-title">NEWS</h1>
      </div>
      <div class="page-meta">PROJECT ARGO NOTE<br>READING FILE</div>
    </header>

    <div class="cover-panel">
      ${coverImage(newsItem,"뉴스 미리보기")}
      <p class="cover-label">NEWS</p>
      <p class="cover-copy">${
        newsItem?.summary
          ? escapeHtml(newsItem.summary)
          : "현장 소식과 기사 자료를 열람합니다. 상단 책갈피를 선택하면 기사 목록으로 이동합니다."
      }</p>
    </div>
  `;

  rightPage.innerHTML = `
    <header class="page-header">
      <div>
        <p class="page-kicker">LOUNGE READING MATERIAL</p>
        <h1 class="page-title">SHORT STORY</h1>
      </div>
      <div class="page-meta">PROJECT ARGO NOTE<br>STORY FILE</div>
    </header>

    <div class="cover-panel">
      ${coverImage(storyItem,"단편 미리보기")}
      <p class="cover-label">SHORT STORY</p>
      <p class="cover-copy">${
        storyItem?.summary
          ? escapeHtml(storyItem.summary)
          : "단편, 취재 기록, 여행기를 열람합니다. 상단 책갈피를 선택하면 글 목록으로 이동합니다."
      }</p>
    </div>
  `;
}

function renderSection(type){
  const isNews = type === "news";
  const data = visibleItems(isNews ? NEWS_ARTICLES : STORY_ARTICLES);

  newsTab.classList.toggle("active",isNews);
  storyTab.classList.toggle("active",!isNews);

  leftPage.innerHTML = `
    <header class="page-header">
      <div>
        <p class="page-kicker">LOUNGE READING MATERIAL</p>
        <h1 class="page-title">${isNews ? "NEWS" : "SHORT STORY"}</h1>
      </div>
      <div class="page-meta">INDEX</div>
    </header>

    <div class="article-list">
      ${
        data.length
          ? data.map((item,index)=>`
              <button class="article-button ${index===0 ? "active" : ""}" type="button" data-index="${index}">
                <span class="article-category">${isNews ? "NEWS FILE" : "STORY FILE"}</span>
                <span class="article-title">${escapeHtml(item.title)}</span>
                <span class="article-date">${escapeHtml(item.issue || "")}</span>
              </button>
            `).join("")
          : `<div class="placeholder">등록된 글이 없습니다.</div>`
      }
    </div>
  `;

  if(data.length) renderArticle(data[0]);
  else rightPage.innerHTML = `<div class="cover-panel"><p class="cover-copy">등록된 글이 없습니다.</p></div>`;

  leftPage.querySelectorAll(".article-button").forEach(button=>{
    button.addEventListener("click",()=>{
      leftPage.querySelectorAll(".article-button").forEach(b=>b.classList.remove("active"));
      button.classList.add("active");
      renderArticle(data[Number(button.dataset.index)]);
    });
  });
}

function renderArticle(item){
  rightPage.innerHTML = `
    <header class="page-header">
      <div>
        <p class="page-kicker">SELECTED FILE</p>
        <h1 class="page-title">READING</h1>
      </div>
      <div class="page-meta">${escapeHtml(item.issue || "")}</div>
    </header>

    <article class="article-view">
      <h2>${escapeHtml(item.title)}</h2>
      <p class="meta">${escapeHtml(item.issue || "")}</p>
      ${articleImage(item)}
      ${paragraphs(item.body)}
    </article>
  `;
}

newsTab.addEventListener("click",()=>renderSection("news"));
storyTab.addEventListener("click",()=>renderSection("story"));

loungeBody.addEventListener("click",(event)=>{
  if(!loungeBook.contains(event.target)){
    parent.postMessage("ARGO_CLOSE_PANEL","*");
  }
});

loungeBook.addEventListener("click",(event)=>event.stopPropagation());

async function bootLounge(){
  try{
    const [news,stories] = await Promise.all([
      loadJson("content/lounge/news.json"),
      loadJson("content/lounge/stories.json")
    ]);

    NEWS_ARTICLES = news?.items || [];
    STORY_ARTICLES = stories?.items || [];
  }catch(error){
    console.error("LOUNGE content load failed:",error);
  }

  renderCover();
}

bootLounge();
</script>
</body>
</html>
