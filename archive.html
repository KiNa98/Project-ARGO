<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Archive</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  color:#edf4f7;
  font-family:"Noto Sans CJK KR","Noto Sans KR","Malgun Gothic",sans-serif;
}

body{
  display:grid;
  place-items:center;
  padding:4.8vh 5.2vw;
}

/* =========================================================
   ARCHIVE WINDOW
   ========================================================= */
.archive-window{
  position:relative;

  width:min(84vw,1480px);
  height:min(82vh,820px);

  display:flex;
  flex-direction:column;

  overflow:hidden;

  border:1px solid rgba(145,215,250,.66);
  border-radius:10px;

  background:
    linear-gradient(
      180deg,
      rgba(18,72,104,.60),
      rgba(9,40,61,.54)
    );

  box-shadow:
    0 24px 90px rgba(0,0,0,.48),
    0 0 24px rgba(92,196,245,.16),
    inset 0 0 42px rgba(85,190,235,.05);

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}

/* =========================================================
   TOP TAB BAR
   ========================================================= */
.archive-tabs{
  flex:0 0 auto;

  display:flex;
  align-items:center;
  gap:8px;

  padding:15px 22px;

  border-bottom:1px solid rgba(190,230,247,.14);

  background:rgba(2,14,22,.11);
}

.archive-brand{
  margin-right:auto;

  color:rgba(218,237,246,.50);
  font-size:9px;
  letter-spacing:.17em;
}

.archive-tab{
  padding:8px 14px;

  border:1px solid rgba(190,230,247,.14);
  border-radius:4px;

  background:rgba(4,21,31,.14);
  color:#c6d5dc;

  font:inherit;
  font-size:11px;
  font-weight:700;
  letter-spacing:.06em;

  cursor:pointer;
}

.archive-tab:hover,
.archive-tab:focus-visible{
  border-color:rgba(160,222,250,.42);
  outline:none;
}

.archive-tab.active{
  background:rgba(62,150,191,.20);
  border-color:rgba(135,218,255,.64);
  color:#fff;
}

.archive-content{
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
}

/* =========================================================
   WORLD VIEW
   - 별도의 큰 "세계관" 제목은 두지 않는다.
   - 짧은 문서 항목을 쌓아 읽는 구조.
   ========================================================= */
.world-view{
  height:100%;
  padding:26px 32px 34px;
  overflow:auto;
}

.world-subtabs{
  display:flex;
  gap:8px;

  margin-bottom:18px;
  padding-bottom:12px;

  border-bottom:1px solid rgba(190,230,247,.13);
}

.world-subtab{
  padding:7px 12px;

  border:0;
  border-bottom:2px solid transparent;

  background:transparent;
  color:#9fb0ba;

  font:inherit;
  font-size:12px;

  cursor:pointer;
}

.world-subtab:hover,
.world-subtab:focus-visible{
  color:#e8f3f8;
  outline:none;
}

.world-subtab.active{
  color:#fff;
  border-bottom-color:rgba(130,214,255,.74);
}

.world-doc{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.world-entry{
  padding:16px 18px;

  border:1px solid rgba(190,230,247,.10);
  border-radius:5px;

  background:rgba(2,13,20,.12);
}

.world-entry-title{
  display:flex;
  align-items:center;
  gap:9px;

  margin:0 0 7px;

  color:#eaf4f8;
  font-size:14px;
  font-weight:600;
}

.world-entry-title::before{
  content:"◆";
  color:#79cfff;
  font-size:8px;
}

.world-entry p{
  margin:0;

  color:#cad7dc;
  font-size:13px;
  line-height:1.8;
}

/* =========================================================
   SETTINGS VIEW
   좌측: "개념: 워프 장치", "사건: 외계 전쟁" 식 목록
   우측: 이미지 + 텍스트
   이미지와 글 사이에는 경계선을 두지 않는다.
   ========================================================= */
.setting-view{
  height:100%;

  display:grid;
  grid-template-columns:280px 1fr;
}

.setting-index{
  padding:24px 18px;

  overflow:auto;

  border-right:1px solid rgba(190,230,247,.13);
}

.setting-index-label{
  margin:0 0 13px;
  padding:0 8px;

  color:rgba(216,235,244,.46);
  font-size:9px;
  letter-spacing:.17em;
}

.setting-button{
  width:100%;

  padding:12px 10px;

  border:0;
  border-bottom:1px solid rgba(190,230,247,.08);

  background:transparent;
  color:#bdccd3;

  font:inherit;
  font-size:12px;
  line-height:1.5;
  text-align:left;

  cursor:pointer;
}

.setting-button:hover,
.setting-button:focus-visible,
.setting-button.active{
  background:rgba(67,145,180,.13);
  color:#fff;
  outline:none;
}

.setting-detail{
  height:100%;
  padding:22px 30px 24px;

  overflow:hidden;
}

.setting-kicker{
  margin:0 0 7px;

  color:rgba(207,228,238,.48);
  font-size:9px;
  letter-spacing:.16em;
}

.setting-image{
  position:relative;

  width:100%;
  height:72%;
  min-height:420px;
  max-height:560px;

  margin-bottom:14px;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      rgba(29,74,98,.28),
      rgba(5,25,37,.34)
    );
}

.setting-image img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

.setting-image-placeholder{
  position:absolute;
  inset:0;

  display:grid;
  place-items:center;

  color:rgba(214,235,245,.38);
  font-size:10px;
  letter-spacing:.12em;
}

.setting-detail h1{
  margin:0 0 7px;

  color:#fff;
  font-size:29px;
  font-weight:600;
}

.setting-short{
  margin:0 0 8px;

  color:#d9e4e9;
  font-size:13px;
  line-height:1.5;
}

.setting-body{
  color:#bdcbd1;
  font-size:12px;
  line-height:1.5;
}

.setting-body p{
  margin:0 0 4px;
}

/* =========================================================
   PERSONNEL ROSTER
   대표 이미지 + 이름만 보여주는 명부.
   별도 필터 버튼 없음.
   ========================================================= */
.personnel-roster{
  height:100%;
  padding:28px 30px 34px;
  overflow:auto;
}

.roster-note{
  margin:0 0 18px;

  color:rgba(210,231,240,.52);
  font-size:10px;
  letter-spacing:.10em;
}

.roster-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}

.roster-card{
  position:relative;

  min-height:220px;

  overflow:hidden;

  border:1px solid rgba(190,230,247,.13);
  border-radius:5px;

  background:rgba(2,13,20,.13);

  cursor:pointer;

  transition:
    transform .16s ease,
    border-color .16s ease,
    background .16s ease;
}

.roster-card:hover,
.roster-card:focus-visible{
  transform:translateY(-2px);
  border-color:rgba(139,218,255,.46);
  background:rgba(25,77,101,.18);
  outline:none;
}

.roster-image{
  width:100%;
  aspect-ratio:16/10;

  display:grid;
  place-items:center;

  overflow:hidden;

  background:rgba(3,17,26,.28);
}

.roster-image img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

.roster-placeholder{
  color:rgba(212,232,241,.38);
  font-size:10px;
  letter-spacing:.10em;
}

.roster-name{
  padding:13px 15px 14px;

  color:#f0f6f8;
  font-size:15px;
  font-weight:600;
}

/* =========================================================
   PERSONNEL DETAIL
   ========================================================= */
.personnel-detail{
  height:100%;

  display:grid;
  grid-template-columns:minmax(0,1.03fr) minmax(0,.97fr);
}

.viewer{
  min-width:0;

  padding:28px 28px 24px;

  display:flex;
  flex-direction:column;

  border-right:1px solid rgba(190,230,247,.15);
}

.viewer-main{
  position:relative;

  flex:1;
  min-height:0;

  display:grid;
  place-items:center;

  overflow:hidden;

  border:1px solid rgba(190,230,247,.19);
  border-radius:5px;

  background:rgba(2,12,19,.25);
}

.viewer-main::before{
  content:"PERSONNEL IMAGE VIEWER";

  position:absolute;
  left:16px;
  top:13px;

  color:rgba(220,238,246,.43);
  font-size:9px;
  letter-spacing:.18em;
}

.viewer-main img{
  display:block;
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

.detail-placeholder{
  color:rgba(221,235,241,.46);
  font-size:11px;
  letter-spacing:.08em;
}

.thumb-row{
  height:72px;
  margin-top:10px;

  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.thumb{
  display:grid;
  place-items:center;

  border:1px solid rgba(195,228,242,.16);
  border-radius:4px;

  background:rgba(4,18,27,.22);
  color:#cbd9df;

  font-size:10px;

  cursor:pointer;
}

.thumb.active{
  border-color:rgba(128,216,255,.72);
  background:rgba(43,116,150,.20);
}

.profile{
  min-width:0;

  padding:32px 36px 28px;

  overflow:auto;
}

.back-roster{
  margin:0 0 18px;
  padding:6px 0;

  border:0;
  background:transparent;
  color:#a9c1cd;

  font:inherit;
  font-size:10px;
  letter-spacing:.08em;

  cursor:pointer;
}

.back-roster:hover{
  color:#fff;
}

.profile-name{
  display:flex;
  align-items:baseline;
  gap:13px;

  margin:0 0 11px;
}

.profile-name h1{
  margin:0;

  color:#fff;
  font-size:36px;
  font-weight:600;
}

.meta{
  color:#aebdc5;
  font-size:12px;
}

.quote{
  margin:0 0 25px;
  padding-left:11px;

  border-left:2px solid rgba(113,203,245,.68);

  color:#d1dbe0;
  font-size:14px;
  font-style:italic;
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;

  column-gap:40px;
  row-gap:14px;
}

.info-pair,
.info-wide{
  display:grid;
  grid-template-columns:54px 1fr;
  gap:9px;
}

.info-wide{
  margin-top:14px;
}

.label{
  color:#9eb0ba;
  font-size:12px;
}

.value{
  color:#f0f4f6;
  font-size:13px;
  line-height:1.6;
}

.divider{
  margin:23px 0 17px;
  height:1px;

  background:rgba(216,235,244,.34);
}

.summary{
  margin:0;

  color:#d9e1e5;
  font-size:13px;
  line-height:1.9;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media(max-width:920px){
  body{
    padding:3vh 3vw;
    overflow:auto;
  }

  .archive-window{
    width:94vw;
    height:auto;
    min-height:90vh;
  }

  .archive-tabs{
    flex-wrap:wrap;
  }

  .archive-brand{
    width:100%;
  }

  .setting-view,
  .personnel-detail{
    grid-template-columns:1fr;
  }

  .setting-index,
  .viewer{
    border-right:0;
    border-bottom:1px solid rgba(190,230,247,.15);
  }

  .roster-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .viewer{
    min-height:500px;
  }
}

@media(max-width:620px){
  .roster-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body id="archiveBody">

<main class="archive-window" id="archiveWindow">

  <nav class="archive-tabs">
    <div class="archive-brand">SEOUL RESTORATION NETWORK / ARCHIVE</div>

    <button class="archive-tab active" data-view="world" type="button">세계관</button>
    <button class="archive-tab" data-view="region" type="button">지역</button>
    <button class="archive-tab" data-view="setting" type="button">설정</button>
    <button class="archive-tab" data-view="personnel" type="button">인물</button>
  </nav>

  <section class="archive-content" id="archiveContent"></section>

</main>

<script>

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function paragraphs(text){
  const raw = String(text ?? "").trim();
  if(!raw) return "";
  return raw
    .split(/\n\s*\n/)
    .map(p => `<p>${escapeHtml(p).replaceAll("\n","<br>")}</p>`)
    .join("");
}

async function loadJson(path){
  const response = await fetch(path, {cache:"no-store"});
  if(!response.ok) throw new Error(`${path}: ${response.status}`);
  return response.json();
}


const archiveBody = document.getElementById("archiveBody");
const archiveWindow = document.getElementById("archiveWindow");
const archiveContent = document.getElementById("archiveContent");
const tabs = [...document.querySelectorAll(".archive-tab")];

let WORLD_DATA = {background:[], concept:[], group:[]};
let REGION_DATA = [];
let SETTING_DATA = [];
let PERSONNEL_DATA = [];

function visibleItems(items){
  return (Array.isArray(items) ? items : []).filter(item => item.visible !== false);
}

/* =========================================================
   WORLD
   ========================================================= */
function renderWorld(){
  archiveContent.innerHTML = `
    <section class="world-view">
      <nav class="world-subtabs">
        <button class="world-subtab active" data-world="background" type="button">배경</button>
        <button class="world-subtab" data-world="concept" type="button">개념</button>
        <button class="world-subtab" data-world="group" type="button">집단</button>
      </nav>
      <div class="world-doc" id="worldDoc"></div>
    </section>
  `;

  const worldDoc = document.getElementById("worldDoc");

  function showWorld(key){
    const list = Array.isArray(WORLD_DATA[key]) ? WORLD_DATA[key] : [];
    worldDoc.innerHTML = list.length
      ? list.map(item=>`
          <article class="world-entry">
            <h2 class="world-entry-title">${escapeHtml(item.title)}</h2>
            <p>${escapeHtml(item.text)}</p>
          </article>
        `).join("")
      : `<article class="world-entry"><p>등록된 항목이 없습니다.</p></article>`;

    archiveContent.querySelectorAll(".world-subtab").forEach(button=>{
      button.classList.toggle("active",button.dataset.world===key);
    });
  }

  archiveContent.querySelectorAll(".world-subtab").forEach(button=>{
    button.addEventListener("click",()=>showWorld(button.dataset.world));
  });

  showWorld("background");
}

/* =========================================================
   SETTINGS
   ========================================================= */
function renderSetting(){
  const items = visibleItems(SETTING_DATA);

  archiveContent.innerHTML = `
    <section class="setting-view">
      <aside class="setting-index">
        <p class="setting-index-label">ARCHIVE INDEX</p>
        ${
          items.length
            ? items.map((item,index)=>`
                <button
                  class="setting-button ${index===0 ? "active" : ""}"
                  type="button"
                  data-index="${index}"
                >${escapeHtml(item.label || item.title)}</button>
              `).join("")
            : `<div class="setting-button">등록된 설정이 없습니다.</div>`
        }
      </aside>

      <article class="setting-detail" id="settingDetail"></article>
    </section>
  `;

  const detail = document.getElementById("settingDetail");

  function showSetting(index){
    const item = items[index];
    if(!item){
      detail.innerHTML = `<p class="setting-short">등록된 설정이 없습니다.</p>`;
      return;
    }

    detail.innerHTML = `
      <p class="setting-kicker">${escapeHtml(item.type || "SETTING")}</p>

      <div class="setting-image">
        ${
          item.image
            ? `<img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title)}"
                    onerror="this.style.display='none';this.nextElementSibling.style.display='grid';">`
            : ``
        }
        <div class="setting-image-placeholder" style="${item.image ? "display:none;" : ""}">
          SETTING IMAGE
        </div>
      </div>

      <h1>${escapeHtml(item.title)}</h1>
      <p class="setting-short">${escapeHtml(item.short)}</p>
      <div class="setting-body">${paragraphs(item.body)}</div>
    `;
  }

  archiveContent.querySelectorAll(".setting-button[data-index]").forEach(button=>{
    button.addEventListener("click",()=>{
      archiveContent.querySelectorAll(".setting-button").forEach(b=>b.classList.remove("active"));
      button.classList.add("active");
      showSetting(Number(button.dataset.index));
    });
  });

  showSetting(0);
}

/* =========================================================
   PERSONNEL ROSTER
   ========================================================= */
function renderPersonnelRoster(){
  const items = visibleItems(PERSONNEL_DATA);

  archiveContent.innerHTML = `
    <section class="personnel-roster">
      <p class="roster-note">REGISTERED PERSONNEL / 명부에 등록된 인원</p>

      <div class="roster-grid">
        ${
          items.length
            ? items.map((person,index)=>`
                <button class="roster-card" type="button" data-index="${index}">
                  <div class="roster-image">
                    ${
                      person.cover
                        ? `<img src="${escapeHtml(person.cover)}" alt="${escapeHtml(person.name)}"
                                onerror="this.style.display='none';this.nextElementSibling.style.display='block';">`
                        : ``
                    }
                    <span class="roster-placeholder" style="${person.cover ? "display:none;" : ""}">
                      REPRESENTATIVE IMAGE
                    </span>
                  </div>
                  <div class="roster-name">${escapeHtml(person.name)}</div>
                </button>
              `).join("")
            : `<div class="roster-note">등록된 인물이 없습니다.</div>`
        }
      </div>
    </section>
  `;

  archiveContent.querySelectorAll(".roster-card").forEach(card=>{
    card.addEventListener("click",()=>renderPersonnelDetail(items, Number(card.dataset.index)));
  });
}

function renderPersonnelDetail(items,index){
  const person = items[index];
  if(!person) return renderPersonnelRoster();

  const gallery = Array.isArray(person.gallery) && person.gallery.length
    ? person.gallery
    : [null,null,null,null,null];

  archiveContent.innerHTML = `
    <section class="personnel-detail">

      <section class="viewer">
        <div class="viewer-main" id="viewerMain">
          ${
            gallery[0]
              ? `<img src="${escapeHtml(gallery[0])}" alt="${escapeHtml(person.name)}">`
              : `<span class="detail-placeholder">CHARACTER IMAGE</span>`
          }
        </div>

        <div class="thumb-row">
          ${Array.from({length:5},(_,i)=>`
            <button class="thumb ${i===0 ? "active" : ""}" type="button" data-index="${i}">
              ${i===4 ? "SHEET" : String(i+1).padStart(2,"0")}
            </button>
          `).join("")}
        </div>
      </section>

      <section class="profile">
        <button class="back-roster" id="backRoster" type="button">← PERSONNEL LIST</button>

        <div class="profile-name">
          <h1>${escapeHtml(person.name)}</h1>
          <span class="meta">(${escapeHtml(person.age)} / ${escapeHtml(person.gender)})</span>
        </div>

        <p class="quote">“${escapeHtml(person.quote)}”</p>

        <div class="info-grid">
          <div class="info-pair"><span class="label">분류</span><span class="value">${escapeHtml(person.species)}</span></div>
          <div class="info-pair"><span class="label">출신</span><span class="value">${escapeHtml(person.origin)}</span></div>
          <div class="info-pair"><span class="label">직업</span><span class="value">${escapeHtml(person.job)}</span></div>
          <div class="info-pair"><span class="label">소속</span><span class="value">${escapeHtml(person.affiliation)}</span></div>
        </div>

        <div class="info-wide"><span class="label">외모</span><span class="value">${escapeHtml(person.appearance)}</span></div>

        <div class="info-wide">
          <span class="label">복장</span>
          <span class="value">${
            (Array.isArray(person.outfits) ? person.outfits : [])
              .map((x,i)=>`${String.fromCharCode(65+i)}. ${escapeHtml(x)}`)
              .join("<br>")
          }</span>
        </div>

        <div class="info-wide"><span class="label">특기</span><span class="value">${escapeHtml(person.specialty)}</span></div>

        <div class="divider"></div>
        <p class="summary">${escapeHtml(person.summary)}</p>
      </section>
    </section>
  `;

  document.getElementById("backRoster").addEventListener("click",renderPersonnelRoster);

  const viewerMain = document.getElementById("viewerMain");
  const thumbs = [...archiveContent.querySelectorAll(".thumb")];

  thumbs.forEach(button=>{
    button.addEventListener("click",()=>{
      const i = Number(button.dataset.index);
      thumbs.forEach(b=>b.classList.remove("active"));
      button.classList.add("active");

      if(gallery[i]){
        viewerMain.innerHTML = `<img src="${escapeHtml(gallery[i])}" alt="${escapeHtml(person.name)}">`;
      }else{
        viewerMain.innerHTML = `<span class="detail-placeholder">CHARACTER IMAGE</span>`;
      }
    });
  });
}

function switchArchive(view){
  tabs.forEach(tab=>tab.classList.toggle("active",tab.dataset.view===view));
  if(view==="world") renderWorld();
  if(view==="setting") renderSetting();
  if(view==="personnel") renderPersonnelRoster();
}

tabs.forEach(tab=>{
  tab.addEventListener("click",()=>switchArchive(tab.dataset.view));
});

archiveBody.addEventListener("click",(event)=>{
  if(!archiveWindow.contains(event.target)){
    parent.postMessage("ARGO_CLOSE_PANEL","*");
  }
});

archiveWindow.addEventListener("click",(event)=>event.stopPropagation());

async function bootArchive(){
  try{
    const [world,settings,personnel] = await Promise.all([
      loadJson("content/archive/world.json"),
      loadJson("content/archive/settings.json"),
      loadJson("content/archive/personnel.json")
    ]);

    WORLD_DATA = world || WORLD_DATA;
    SETTING_DATA = settings?.items || [];
    PERSONNEL_DATA = personnel?.items || [];
  }catch(error){
    console.error("ARCHIVE content load failed:",error);
  }

  switchArchive("world");
}

bootArchive();
</script>
