<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;background:transparent;color:#edf3f6;
  font-family:"Noto Sans CJK KR","Noto Sans KR","Malgun Gothic",sans-serif
}
body{
  padding:0;
  background:
    linear-gradient(rgba(6,16,24,.46), rgba(6,16,24,.46));
}
.page{
  width:100%;height:100%;padding:20px;
}
.panel{
  width:100%;height:100%;
  padding:42px 40px;
  background:linear-gradient(180deg, rgba(12,48,72,.54), rgba(8,32,50,.46));
  border:1px solid rgba(170,225,255,.34);
  border-radius:8px;
  box-shadow:
    inset 0 0 34px rgba(120,210,255,.06),
    0 0 24px rgba(90,180,220,.10);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.eyebrow{
  margin:0 0 8px;
  color:#c3d3dc;
  font-size:11px;
  letter-spacing:.28em
}
h1{
  margin:0;
  font-size:clamp(22px,2.8vw,38px);
  font-weight:600;
  letter-spacing:.01em
}
.sub{
  margin:14px 0 32px;
  color:#d4dde2;
  font-size:13px
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px
}
.card{
  min-height:180px;
  padding:22px;
  border:1px solid rgba(200,230,245,.16);
  background:rgba(3,16,24,.16);
  color:inherit;
  text-decoration:none;
  transition:background .16s ease, border-color .16s ease, transform .16s ease
}
.card:hover{
  background:rgba(40,100,132,.22);
  border-color:rgba(200,235,250,.36);
  transform:translateY(-2px)
}
.card strong{
  display:block;
  margin-bottom:12px;
  font-size:18px;
  font-weight:600
}
.card span{
  color:#d0d9de;
  line-height:1.75;
  font-size:13px
}
@media(max-width:900px){
  .page{padding:14px}
  .panel{padding:26px 20px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="page">
<section class="panel">
  <p class="eyebrow">SEOUL RESTORATION NETWORK / OFFICE</p>
  <h1>ARCHIVE</h1>
  <p class="sub">출입 명부 및 기록 확인</p>

  <div class="grid">
    <a class="card" href="#">
      <strong>PERSONNEL</strong>
      <span>인명 데이터베이스. 캐릭터 이미지, 기본 프로필, 소개 기록을 열람합니다.</span>
    </a>
    <a class="card" href="#">
      <strong>WORLD RECORD</strong>
      <span>지역, 시설, 사건, 생태 및 기술 관련 기록을 열람합니다.</span>
    </a>
    <a class="card" href="#">
      <strong>FIELD LOG</strong>
      <span>현장 조사와 복구 사업 과정에서 축적된 기록을 열람합니다.</span>
    </a>
  </div>
</section>
</div>
</body>
</html>
